name: Validate PR

on:
  # No `paths:` filter: this job is a required status check, and a required
  # check that never runs leaves PRs stuck on "Expected".
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Server Definitions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get changed server files
        id: changed
        uses: tj-actions/changed-files@2d756ea4c53f7f6b397767d8723b3a10a9f35bf2 # v44.0.0
        with:
          files: "servers/*.json"

      - name: Validate changed server files
        # Runs schema validation AND category-reference checks via scripts/validate.js.
        # A category ID not present in categories.json fails here, since the
        # bundler's server_categories table has a FK to categories.id and a
        # typo would silently break sync for that server.
        env:
          # Via env, never interpolated into the script: filenames come from the PR.
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        run: |
          set -f  # one argument per file, no glob expansion
          if [ -n "$CHANGED_FILES" ]; then
            # shellcheck disable=SC2086 # word splitting is intended
            npm run validate -- $CHANGED_FILES
          else
            echo "No changed server files detected, running full validation as fallback"
            npm run validate:all
          fi

      - name: Check for conflicts
        run: npm run check-conflicts

      - name: Check provenance of changed server files
        # The install source exists and is published by the links.repository
        # owner, the logo belongs to that owner, and the endpoint answers.
        # Network-dependent: only definitive failures are errors. See
        # CONTRIBUTING.md -> Provenance Checks.
        if: steps.changed.outputs.all_changed_files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -f
          # shellcheck disable=SC2086 # word splitting is intended
          npm run check-provenance -- $CHANGED_FILES

      - name: Run full test suite
        # Covers cross-file consistency checks (categories.json, bundle build,
        # deprecated `icon` field, logo URL format) that per-file validation
        # can't express.
        run: npm test
